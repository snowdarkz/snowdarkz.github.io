ช่วยวิเคราะห์และวางแผนการกดกาชาตู้จำกัดเวลา [ธุลีล่องรอยฝัน] (เทศกาลเหอฮวน) โดยอ้างอิงจากข้อมูลแพ็กเกจ ระบบตู้ เงื่อนไขการสุ่ม และแบ่งคำนวณตามกรณีต่างๆ ด้านล่างนี้:

---

### 1. ข้อมูลพื้นฐานตู้ & ระบบการันตี (🚨 เงื่อนไขสำคัญเรื่องการันตี)
- ตู้ 5 ชายหนุ่มระดับ 6 ดาว (เซียวอี้, ลู่เฉิน, ฉีซือหลี่, จาหลี่ซู, เซี่ยหมิงซิง)
- Pity การันตีพื้นฐาน: ทุกๆ 70 สุ่ม จะการันตีได้ 6 ดาว 1 ใบ (**ไม่มีระบบการันตีหลุดเรทหน้าตู้แบบปกติ**)
- Spark / ร้านค้าแลกการ์ด (ที่คั่นเหอฮวน):
  - 1 สุ่ม = 1 ที่คั่นเหอฮวน
  - **140 ที่คั่นเหอฮวน = การันตีเลือกแลกการ์ด 6 ดาวตัวละครที่ต้องการแน่ๆ 1 ใบ** (จำกัดตัวละ 2 ครั้ง)
- โบนัส Milestone การสุ่ม:
  - 80 / 120 / 140 / 160 / 180 สุ่ม = ได้รับ [กล่องโปรไฟล์คู่รัก] (การันตีได้ครบ 5 คน ไม่ซ้ำ)
  - 100 สุ่ม = สุ่มได้การ์ด 6 ดาวหน้าตู้ฟรี 1 ใบ
  - 200 สุ่ม = ได้รับ [กล่องเลือกสายสัมพันธ์ 6 ดาวหน้าตู้] เลือกได้เลย 1 ใบ

---

### 2. กฎของประเภทตั๋วและการจัดการ (ตั๋วกระรอก VS ตั๋วแดง)
- **ตั๋วกระรอก (ตั๋วลีมิตจำกัดเวลา):** ประกอบด้วย [ตั๋วสิบครั้ง - ฝันนิรันดร์] (ซองลายกระรอกถือเห็ด) และ [ฝันสีอัสดง] (ตั๋วเดี่ยว ตัวกระรอกสีชมพู)
  - ⚠️ **เงื่อนไข:** ใช้ได้เฉพาะตู้ "ธุลีล่องรอยฝัน" เท่านั้น ไม่สามารถนำไปกดตู้ถาวรหรือตู้ชายหนุ่มกิจกรรมอื่นได้ หากจบกิจกรรมตั๋วจะไม่หาย และจะถูกเก็บไว้ใช้ต่อยามตู้ "ธุลีล่องรอยฝัน" รีรันในอนาคตได้
- **ตั๋วแดง (ตั๋วสุ่มสิบครั้งมาตรฐาน):**
  - 🌐 **เงื่อนไข:** สามารถใช้กดตู้จำกัดเวลาได้ทุกตู้ ไม่มีวันหมดอายุ ข้ามไปใช้กับตู้ชายหนุ่มคนอื่นในอนาคตได้
- **กลยุทธ์การกด:** เน้นกดแบบ 10 ครั้ง (10 Pull) เป็นหลัก หากมีตั๋วเดี่ยว [ฝันสีอัสดง] เศษไม่ครบ 10 ใบ ให้ใช้ดาวเหนือซื้อตั๋วเดี่ยว [ฝันสีอัสดง] ในร้านค้าเพิ่ม (ใบละ 6 ดาวเหนือ) ให้ครบ 10 ใบ เพื่อรวบกดแบบ 10 Pull

---

### 3. ของแจกฟรีจากกิจกรรม (แบ่งคิดเป็น 2 กรณี)
- 🔹 **กรณีฟรี 30 สุ่ม:** สายเล่นชิล/เก็บไม่ครบภารกิจ (รับเฉพาะของแจกการันตีที่ไม่ต้องทำภารกิจส่วนตัวเพิ่ม)
- 🔸 **กรณีฟรี 64 สุ่ม:** สายเก็บครบทุกภารกิจ (ตั๋วกระรอกจำกัดเวลา 48 สุ่ม + กลุ่มดาวหมีเล็ก 2,400 ดวง = 16 สุ่ม)

---

### 4. รายละเอียดแพ็กเกจทั้งหมดในกิจกรรม (Package Database)
*(⚠️ หมายเหตุเงื่อนไขสำคัญ: แพ็กเกจที่มีสัญลักษณ์ II เช่น ฝันสีอัสดง•II, รอยฝันนิรันดร์•II, คัดสรรสุ่ม 10•II, เว็บช็อป II จะปลดล็อกให้ซื้อได้ก็ต่อเมื่อ "ซื้อแพ็กเกจ I ก่อนแล้วเท่านั้น")*

#### 🔹 [กลุ่ม A] พรีออเดอร์สุดคุ้ม (1 – 4 ส.ค.)
- **กล่องฝันตระการตา•เหอฮวน (340 บาท):** ตั๋วกระรอกสิบครั้ง × 1 + ตั๋วกระรอกเดี่ยว × 2 (**รวม 12 สุ่ม**) ➔ เฉลี่ย 28.33 บาท/สุ่ม
- **กล่องฝันตระการตา•โคมไฟ (490 บาท):** ตั๋วกระรอกสิบครั้ง × 1 + ตั๋วกระรอกเดี่ยว × 8 (**รวม 18 สุ่ม**) ➔ เฉลี่ย 27.22 บาท/สุ่ม

#### 🔹 [กลุ่ม B] แพ็กเกจรายวัน & ขนาดเล็ก (1 – 14 ส.ค.)
- **ของขวัญฝันสีอัสดง•I (30 บาท):** ตั๋วกระรอกเดี่ยว × 1 (**1 สุ่ม**) ➔ เฉลี่ย 30.00 บาท/สุ่ม
- **ของขวัญฝันสีอัสดง•II (60 บาท):** *(ปลดล็อกหลังซื้อแพ็ก I)* ดาวเหนือ × 3 (0.5 สุ่ม) + ตั๋วกระรอกเดี่ยว × 1 (**รวม 1.5 สุ่ม**) ➔ เฉลี่ย 40.00 บาท/สุ่ม
- **ข้อเสนอพิเศษสุ่ม 10 (ใช้ 20 ดาวเหนือ):** ตั๋วแดงมาตรฐานสิบครั้ง × 1 (**10 สุ่ม**) ➔ คุ้มที่สุดในเกม (ตก 2 ดาวเหนือ/สุ่ม)
- **กล่องของขวัญฝันสีอัสดง (150 บาท):** ตั๋วกระรอกเดี่ยว × 5 (**5 สุ่ม**) [ซื้อได้ 6 ครั้ง] ➔ เฉลี่ย 30.00 บาท/สุ่ม

#### 🔹 [กลุ่ม C] แพ็กเกจขนาดกลางถึงใหญ่ในเกม (4 – 14 ส.ค.)
- **เซ็ต รอยฝันนิรันดร์•I (440 บาท):** ตั๋วกระรอกสิบครั้ง × 1 + ตั๋วกระรอกเดี่ยว × 5 (**รวม 15 สุ่ม**) ➔ เฉลี่ย 29.33 บาท/สุ่ม
- **เซ็ต รอยฝันนิรันดร์•II (940 บาท):** *(ปลดล็อกหลังซื้อแพ็ก I)* ตั๋วกระรอกสิบครั้ง × 3 + ตั๋วกระรอกเดี่ยว × 5 (**รวม 35 สุ่ม**) ➔ เฉลี่ย 26.86 บาท/สุ่ม
- **คัดสรรสุ่ม 10•I (490 บาท):** ดาวเหนือ × 33 (5.5 สุ่ม) + ตั๋วกระรอกสิบครั้ง × 1 + ตั๋วกระรอกเดี่ยว × 1 (**รวม 16.5 สุ่ม**) ➔ เฉลี่ย 29.70 บาท/สุ่ม
- **คัดสรรสุ่ม 10•II (990 บาท):** *(ปลดล็อกหลังซื้อแพ็ก I)* ดาวเหนือ × 66 (11 สุ่ม) + ตั๋วกระรอกสิบครั้ง × 3 + ตั๋วกระรอกเดี่ยว × 3 (**รวม 44 สุ่ม**) ➔ เฉลี่ย 22.50 บาท/สุ่ม

#### 🔹 [กลุ่ม D] ชุดแพ็กเกจ [ของขวัญอธิษฐาน] (10 – 14 ส.ค.)
- **กล่องของขวัญหัวใจสุ่ม 10 (490 บาท):** ตั๋วแดงมาตรฐานสิบครั้ง × 1 + เพชร 2,000 (13.33 สุ่ม) (**รวม 23.33 สุ่ม**) ➔ เฉลี่ย 21.00 บาท/สุ่ม
- **กล่องของขวัญสลักใจสุ่ม 10 (640 บาท):** ตั๋วแดงมาตรฐานสิบครั้ง × 2 (**รวม 20 สุ่ม**) ➔ เฉลี่ย 32.00 บาท/สุ่ม

#### 🔹 [กลุ่ม E] แพ็กเกจพิเศษเฉพาะเว็บช็อป (VNGames Shop)
- **แพ็กพิเศษเฉพาะเว็บช็อป I (2,965 บาท):** ดาวเหนือ × 216 (36 สุ่ม) + ตั๋วกระรอกสิบครั้ง × 10 (100 สุ่ม) (**รวม 136 สุ่ม**) ➔ เฉลี่ย 21.80 บาท/สุ่ม
- **แพ็กพิเศษเฉพาะเว็บช็อป II (5,929 บาท):** *(ปลดล็อกหลังซื้อแพ็ก I)* ดาวเหนือ × 432 (72 สุ่ม) + ตั๋วกระรอกสิบครั้ง × 24 (240 สุ่ม) (**รวม 312 สุ่ม**) ➔ เฉลี่ย 19.00 บาท/สุ่ม

---

### 5. หลักการเลือกซื้อแพ็กเกจ (เน้นความคุ้มค่าสูงสุด / Value First)
1. **อัตราแลกเปลี่ยนราคา "ดาวเหนือ" (3 กรณี):**
   - **กรณีที่ 1 เติมในเกมช่วงมีโบนัส x2 (ซื้อครั้งแรก):** ตกดาวเหนือละ **~7.29 บาท** (สุ่มละ ~43.74 บาท) ➔ *คุ้มค่าที่สุดในการหาดาวเหนือดิบ*
   - **กรณีที่ 2 เติมผ่านเว็บช็อปนอกเกม (VNGames Shop):** ตกดาวเหนือละ **~12.00 บาท** (สุ่มละ ~72.00 บาท) ➔ *คุ้มสุดเมื่อโบนัส x2 ในเกมหมดแล้ว*
   - **กรณีที่ 3 เติมในเกมราคาปกติ (คูณ 2 หมดแล้ว):** ตกดาวเหนือละ **~14.58 บาท** (สุ่มละ ~87.48 บาท) ➔ *แพงที่สุด ไม่แนะนำ*
   - *หมายเหตุ:* แพ็กเกจที่ให้ดาวเหนือมีความคุ้มค่าสูง เพราะเอาไปแลกแพ็กพิเศษ **"ข้อเสนอพิเศษสุ่ม 10" (ใช้ 20 ดาวเหนือได้ 10 สุ่ม)** ได้ ซึ่งคุ้มที่สุดในเกม (คิดเป็นต้นทุนสุ่มละ ~14.58 บาทเท่านั้นถ้าใช้คูณ 2)
2. **การวางแผนซื้อแพ็กเกจแบบต่อขั้น (Tiered Packs):**
   - คำนึงถึงต้นทุนรวมเสมอ เนื่องจากแพ็ก II ที่คุ้มกว่า (เช่น คัดสรรสุ่ม 10•II หรือ รอยฝันนิรันดร์•II) บังคับต้องซื้อแพ็ก I ก่อน
3. **ข้อแนะนำระหว่าง "ตั๋วกระรอก" กับ "ตั๋วแดง":**
   - ตราบใดที่ยังสุ่มตู้นี้ไม่ครบตามเป้าหมาย ให้เน้นซื้อแพ็ก **ตั๋วกระรอก** หรือแพ็กที่ได้เพชร/ดาวเหนือเป็นหลัก เพราะเรทคุ้มค่าต่อสุ่มถูกกว่า
   - ควรเติมตุน **ตั๋วแดง (ตั๋วมาตรฐานถาวร)** เฉพาะ "หลังจากกดกาชาตู้ปัจจุบันจนพอใจ/หยุดกดแล้วเท่านั้น" เพื่อตุนไว้ใช้กับตู้ชายหนุ่มคนอื่นในอนาคต

---

### โจทย์/สิ่งที่ต้องการให้ช่วยสรุปแยกตามกรณี:

📍 **กรณีที่ 1: มีงบเติมประมาณ 1,000 บาท**
- คำนวณแยก 2 แบบ (กรณีได้ฟรี 30 สุ่ม และ 64 สุ่ม) ว่าจัดสรรงบ 1,000 บาทไปกับแพ็กเกจไหนให้ได้จำนวนสุ่มคุ้มที่สุด โดยคำนึงถึงเงื่อนไขปลดล็อกแพ็ก I ➔ II และจะไปหยุดที่กี่สุ่ม (ไปถึง Milestone ไหน และการันตีเลือกตัวเมนได้หรือไม่)?

📍 **กรณีที่ 2: เดิมมีตุนไว้ 100 โรล อยากไปให้ถึง 200 โรล**
- คำนวณแยก 2 แบบ (กรณีได้ฟรี 30 สุ่ม = มีรวม 130 โรล ขาดอีก 70 โรล / กรณีได้ฟรี 64 สุ่ม = มีรวม 164 โรล ขาดอีก 36 โรล) ว่าต้องเติมแพ็กเกจไหนบ้างตามลำดับขั้นปลดล็อกให้ประหยัดเงินที่สุด?

📍 **กรณีที่ 3: ไม่เน้นแต้ม VIP เน้นความคุ้มค่าด้านราคาต่อสุ่มเป็นหลัก**
- เรียงลำดับแผนการเติมเงินสำหรับผู้เล่นที่ต้องการประสิทธิภาพความคุ้มค่าทางการเงินสูงสุด (Cost-Efficiency) โดยคำนวณราคารวมจริงหลังปลดล็อกแพ็ก I แล้ว
